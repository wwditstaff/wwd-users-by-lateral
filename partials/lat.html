<div class="container-fluid">

<div class="flexrow" >
    <div class="item">
      <input type="text" ng-model="vm.search.LatName" ng-change="vm.saveSearch()" placeholder="Lateral" >
    <button ng-click="vm.clearSearch()">Clear</button>
    </div>
</div>
<div class="flexrow"
     ng-repeat="lateral in vm.laterals | filter:vm.search | orderBy: 'LatName'"
     ng-class="{oddRow: $index % 2 == 0 }">
    <a href="/lat/{{lateral.id}}">
        <div class="item">{{lateral.LatName}}</div>
    </a>
</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
</div>
