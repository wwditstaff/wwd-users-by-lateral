<div class="container-fluid">
    <div class="flexrow">
        <div class="item">
            <strong>Accounts</strong>
        </div>
        <div class="item">
            <input type="text" ng-model="vm.search" ng-change="vm.saveSearch()" placeholder="Customer">
            <button ng-click="vm.clearSearch()">Clear</button>
        </div>
    </div>

    <div class="flexrow">
        <div class="item">Account</div>
        <div class="item">Account Name</div>
    </div>
    <div class="flexrow"
         dir-paginate="item in vm.accounts | filter:vm.search | orderBy:'id' | itemsPerPage: 10 "
         current-page="vm.pagination.current"
         ng-class="{oddRow: $index % 2 == 0}">

        <div class="item"><a href="/account/{{item.id}}">{{ item.id }}</a></div>
        <div class="item"><a href="/account/{{item.id}}">{{ item.FullName }}</a></div>
    </div>
    <dir-pagination-controls on-page-change="vm.pageChanged(newPageNumber)"></dir-pagination-controls>
</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
