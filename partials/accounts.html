<div class="container-fluid">
    <div class="flexrow">
        <div class="item">
            <strong>Accounts</strong>
        </div>
        <div class="item">
            <input type="text" ng-model="vm.search" ng-change="vm.saveSearch()" placeholder="Customer">
            <button ng-click="vm.clearSearch()">Clear</button>
        </div>
    </div>

    <div class="flexrow">
        <div class="item">Account</div>
        <div class="item">Account Name</div>
    </div>
    <div class="flexrow"
         ng-repeat="item in vm.accounts | filter:vm.search |  orderBy:'id' | startFrom: vm.pageStart() | limitTo: vm.pageSize  "
         ng-class="{oddRow: $index % 2 == 0}">
        <div class="item">{{item.id}}</div>
        <div class="item">{{item.name}}</div>
    </div>
</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
