<style>
    .odd {
        background-color: lightgray;
    }
    .even {
        background-color: transparent;
    }
</style>

<div class="row">
    <div class="col-md-10 col-md-offset-1 col-sm-10">
    <h3>{{ vm.lateralname }}</h3>
    </div>
</div>

<div class="row">
        <div class="col-md-1 col-md-offset-1 col-sm-2">Lateral</div>
        <div class="col-md-1 col-sm-2">Meter</div>
        <div class="col-md-2 col-sm-2">Geo</div>
        <div class="col-md-1 col-sm-2">Account</div>
        <div class="col-md-3 col-sm-4">Account Name</div>
</div>
<div class="row" ng-repeat="meter in vm.meters"
     ng-class-even="'even'" ng-class-odd="'odd'" >
    <a href="/lat/{{lateral.id}}">
        <div class="col-md-1 col-md-offset-1 col-sm-2">{{meter.lateral}}</div>
        <div class="col-md-1 col-sm-2">{{meter.meter}}</div>
        <div class="col-md-2 col-sm-2">{{meter.geo}}</div>
        <div class="col-md-1 col-sm-2">{{meter.account}}</div>
        <div class="col-md-3 col-sm-4">{{meter.fullname}}</div>
    </a>
</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
