<div class="container-fluid">

    <div class="flexrow">
        <h3 class="item">{{ vm.lateralname }}</h3>
            <div class="item">
                <input type="text" ng-model="vm.search.searchfield " ng-change="vm.saveSearch()" placeholder="Meter" >
                <button ng-click="vm.clearSearch()">Clear</button>
            </div>
    </div>

    <div class="flexrow">
        <div class="item-opt">Lateral</div>
        <div class="item">Meter</div>
        <div class="item-opt">Geo</div>
        <div class="item">Account</div>
        <div class="item-wide-opt">Account Name</div>
    </div>
    <!--<div class="row" ng-repeat="meter in vm.meters"-->
    <!--ng-class="{oddRow: $index % 2 == 0 }" >-->
    <div class="flexrow"
         ng-repeat="meter in vm.meters | filter:vm.search.searchfield "
         ng-class="{oddRow: $index % 2 == 0 }">
        <div class="item-opt">{{meter.lateral}}</div>
        <div class="item"><a href="/meter/{{meter.meter}}">{{meter.meter}}</a></div>
        <div class="item-opt">{{meter.geo}}</div>
        <div class="item">{{meter.account}}</div>
        <div class="item-wide-opt">{{meter.fullname}}</div>
    </div>
</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
