<div class="container-fluid">

    <div ng-repeat="item in vm.meter" >
        <div class="flexrow" ng-class="{oddRow: $index % 2 == 0}" >
            <div class="item">{{item.name}}</div>
            <div class="item-wide"><strong>{{item.val}}</strong></div>
        </div>
    </div>

</div>
<hr/>
<i>Version : {{ vm.versionInfo }} </i>
